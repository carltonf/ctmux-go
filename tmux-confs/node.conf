# node.conf
#
# Leaf node configuration (local workstation or remote server session)

# create a new session when attaching to a non-existent session
new-session -A -s zero

## Server options
set-option -s escape-time 0

## Prefix (Ctrl-X)
set-option -g prefix C-x
bind-key C-x send-prefix

## Terminal & colors
set-option -g default-terminal screen-256color
set-option -as terminal-features ',*:RGB'

## Display & interaction options
set-option -g bell-action any
set-option -g display-panes-colour blue
set-option -g history-limit 65536
set-option -g message-style fg=black,bg=white
set-option -g pane-active-border-style fg=blue,bg=default
set-option -g pane-border-style fg=cyan,bg=default
set-option -g repeat-time 500
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g set-titles off
set-option -g set-titles-string ' #I '
set-option -g base-index 0

## Status bar
set-option -g status on
set-option -g status-interval 15
set-option -g status-justify left
set-option -g status-left-length 50
set-option -g status-left '(#[fg=red,bold]@#H#[default]) (#[fg=blue,bold,dim](#S)#[default] ('
set-option -g status-right ') ()#[default])'
set-option -g status-style fg=black,bg=white,bold
set-option -g status-keys emacs

## Window title colors & formats
set-option -g window-status-format "(#I #W#F)"
set-option -g window-status-style fg=black,bg=white,dim
set-option -g window-status-current-format "(#I #W#F)"
set-option -g window-status-current-style fg=white,bg=cyan,bold

## Window options
set-option -g remain-on-exit on
set-option -g clock-mode-colour blue
set-option -g clock-mode-style 24
set-option -g monitor-activity on
set-option -g automatic-rename off
set-option -g aggressive-resize off

## Session management
bind-key C command-prompt -I's' -p 'New Session Name:' "new-session -s %% -n ''"

## Window management
bind-key c new-window -n ""
unbind-key &
unbind-key x
bind-key k confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key K kill-window -a
bind-key S choose-tree -f "##{==:##{session_name},services}"

## Pane management
unbind-key %
bind-key V split-window -v
unbind-key '"'
bind-key H split-window -h

## Copy mode (vi style)
set-option -g mode-keys vi
bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

## Capture & logging
# Capture the entire pane including all scrollback history
bind-key C-c capture-pane -S - -E - \; save-buffer '/tmp/tmux-pane.dump'

# Clipboard integration (fallback with xclip if available)
bind-key C-v run-shell "tmux set-buffer \"$(xclip -o -sel clipboard 2>/dev/null)\"; tmux paste-buffer"

# Pipe pane output to log file
bind-key P pipe-pane -o 'cat >>/tmp/tmux-dump-#S-#W.log' \; display-message "Piping enabled for current session!"
